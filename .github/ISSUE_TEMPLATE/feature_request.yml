name: Feature request
description: Proposer une nouvelle fonctionnalité
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Décris la fonctionnalité souhaitée.

  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Quel problème cette fonctionnalité résout-elle ?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution proposée
      description: Comment imagines-tu la solution ?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      options:
        - Acquisition
        - State machine
        - Communication
        - Drivers
        - Platform
        - Tests
        - Documentation
    validations:
      required: false