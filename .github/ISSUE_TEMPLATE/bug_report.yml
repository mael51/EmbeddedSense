name: Bug report
description: Signaler un bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Merci de remplir ce formulaire pour nous aider à reproduire le bug.

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Que se passe-t-il ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Liste des étapes pour reproduire le comportement
      placeholder: |
        1. Compiler avec ...
        2. Lancer ...
        3. Voir l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: OS, compilateur, version
      placeholder: Windows 11, MSYS2 GCC 13.3, CMake 3.28
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / sortie console
      render: shell